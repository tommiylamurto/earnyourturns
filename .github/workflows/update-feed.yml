name: Update feed

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new posts
        id: fetch
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python fetch_posts.py

      - name: Save post history
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/posts.json
          git commit -m "Update posts"
          # If you edited the repo while this run was going, merge that in and retry.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          exit 1

      - name: Build site
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python build_site.py

      - name: Deploy to Cloudflare Pages
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::Variable CF_PAGES_PROJECT is not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          # Create the Pages project on the first run only; show real errors.
          if ! npx --yes wrangler@4 pages project list 2>&1 | grep -qw "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true